name: Refresh ASN metadata

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: asn-metadata-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      REQUESTED_ASNS_URL: https://www.tiekoetter.net/asn-metadata/requested-asns.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - name: Fetch requested ASNs and refresh metadata
        run: >-
          python scripts/update_metadata.py
          --requested-url "$REQUESTED_ASNS_URL"
          --refresh-all
      - name: Commit metadata changes
        run: |
          if git diff --quiet -- data/asn-metadata.json; then
            echo "Metadata is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/asn-metadata.json
          git commit -m "Refresh ASN metadata"
          git push
