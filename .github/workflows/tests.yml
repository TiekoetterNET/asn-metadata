name: Tests

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "data/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt
      - run: python -m unittest discover --start-directory tests
